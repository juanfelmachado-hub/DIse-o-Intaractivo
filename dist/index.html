<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>El susurro de la Tierra</title>
    <meta name="description" content="Cuento interactivo en 3D: Nico y su Guardián aprenden a protegerse durante un temblor.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="./assets/index-BnxS1jco.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CWdY2haH.css">
</head>
<body>
    <canvas class="webgl" aria-label="Libro ilustrado en 3D"></canvas>

    <!-- Pantalla de carga (estilo cuadrícula del moodboard) -->
    <div class="loader" data-loader>
        <div class="loader__dots" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <p class="loader__text">Abriendo el cuento…</p>
    </div>

    <main class="ui" data-ui>
        <!-- Burbujas de texto (wireframe: arriba a la izquierda) -->
        <section class="story-text" aria-live="polite">
            <div class="bubble bubble--narration glass" data-narration hidden>
                <p class="bubble__text"></p>
                <span class="bubble__dots" data-dots aria-hidden="true"></span>
            </div>
            <div class="bubble bubble--dialogue glass" data-dialogue hidden>
                <span class="speaker" data-speaker></span>
                <p class="bubble__text"></p>
            </div>
        </section>

        <!-- Indicador de actividad -->
        <aside class="activity-chip glass" data-activity hidden>
            <span class="activity-chip__label">Actividad</span>
            <strong class="activity-chip__title" data-activity-title></strong>
            <ol class="activity-chip__stops" data-activity-stops></ol>
        </aside>

        <!-- Botones de la actividad 2 -->
        <div class="activity-tray" data-tray hidden></div>

        <!-- Marcadores tocables proyectados sobre el 3D -->
        <div class="hotspots" data-hotspots></div>

        <!-- Pista: la hoja se pasa arrastrándola (no hay botones de navegación) -->
        <div class="drag-hint" data-hint hidden aria-live="polite">
            <span class="drag-hint__hand" aria-hidden="true">
                <svg viewBox="0 0 48 48"><path d="M19 22V9.5a3 3 0 0 1 6 0V20l.2-3.3a3 3 0 0 1 5.9.4l-.1 3.4.4-2.2a3 3 0 0 1 5.9.9l-.4 3.4.4-1.2a2.8 2.8 0 0 1 5.4 1.5l-2.2 9.8A11 11 0 0 1 29.8 41h-3.1a11 11 0 0 1-8.4-3.9l-7-8.4a3 3 0 0 1 4.4-4L19 28z"/></svg>
            </span>
            <span class="drag-hint__label" data-hint-label></span>
        </div>
        <p class="turn-toast" data-toast hidden role="status"></p>

        <!-- El Guardián le habla directamente al lector -->
        <div class="veil" data-veil aria-hidden="true"></div>
        <div class="g-bubble glass" data-guardian-bubble hidden role="dialog" aria-live="assertive">
            <span class="g-bubble__name">Guardián</span>
            <p class="g-bubble__text"></p>
        </div>
    </main>

</body>
</html>
