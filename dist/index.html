<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nico y su guardián personal</title>
    <meta name="description" content="Cuento interactivo en 3D: Nico y su Guardián aprenden a protegerse cuando la tierra se mueve.">
    <!-- Fredoka variable (pesos 300–700, ancho 75–125), alojada en la propia web (Guía visual §3.1) -->
    <link rel="preload" href="./assets/Fredoka-Variable-tvVNXCOf.woff2" as="font" type="font/woff2" crossorigin>
  <script type="module" crossorigin src="./assets/index-BgFOVATH.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-C0Z_nbkt.css">
</head>
<body>
    <!-- Pantalla de carga (estilo cuadrícula del moodboard) -->
    <div class="loader" data-loader>
        <div class="loader__dots" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <p class="loader__text">Abriendo el cuento…</p>
    </div>

    <!-- Guía visual v2 §4.1 y §7: la escena ocupa toda la pantalla. Arriba, la
         pila centrada (actividad + indicaciones/diálogo); abajo, sobre la
         hierba, el cuadro de la historia. Ningún cuadro toca el libro. -->
    <main class="scene" data-scene>
        <canvas class="webgl" aria-label="Libro ilustrado en 3D"></canvas>

        <!-- Marcadores tocables (accesibles con teclado) sobre objetos 3D -->
        <div class="hotspots" data-hotspots></div>
        <!-- El Guardián le habla al lector: velo de atención -->
        <div class="veil" data-veil aria-hidden="true"></div>
        <!-- Juego 1: el radar sigue al dedo -->
        <div class="radar" data-radar hidden aria-hidden="true"><span></span></div>
        <!-- Juego 2: el círculo dorado que late sobre el caparazón -->
        <button class="drum" data-drum type="button" hidden aria-label="Tocar el tambor al ritmo"></button>

        <!-- ARRIBA: nivel 1 actividad (pestaña) y nivel 2 indicaciones o diálogo -->
        <div class="stack-top" data-stack>
            <article class="box box--activity box--activity-tab" data-mission data-state="idle" hidden role="status">
                <div class="mission__icon" data-mission-icon aria-hidden="true"></div>
                <p class="box__text t-mission"><span class="sr-only">Actividad: </span><span data-mission-text></span></p>
            </article>
            <article class="box box--dialog-main" data-dialog data-speaker="guardian" hidden aria-live="polite">
                <div class="avatar" data-avatar aria-hidden="true"></div>
                <p class="box__text t-dialog"><span class="sr-only"><span data-dialog-name>Guardián</span> dice: </span><span data-dialog-text></span></p>
                <button class="turtle-btn" data-turtle type="button" hidden aria-label="Tortuga: agacharse y cubrirse"></button>
            </article>
        </div>

        <!-- Avance del cuento: barra sobre el pie de las hojas, 3 tramos (una
             página = una actividad); la cabeza de Nico marca el progreso real -->
        <div class="progress" data-progress hidden role="progressbar" aria-label="Avance del cuento"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress__track">
                <span class="progress__fill" data-progress-fill></span>
                <i class="progress__sep" data-progress-sep></i>
                <i class="progress__sep" data-progress-sep></i>
            </div>
            <img class="progress__head" data-progress-head alt="" aria-hidden="true">
        </div>

        <!-- Sonidos escritos -->
        <div class="sfx-layer" data-sfx aria-hidden="true"></div>

        <!-- ABAJO: nivel 3, la historia y el botón siguiente (también pasa la página) -->
        <section class="story-box" data-story-bar role="region" aria-label="Texto de la historia">
            <p class="story-box__text t-body" data-story-text aria-live="polite"></p>
            <button class="story-box__next" data-story-next type="button" aria-label="Siguiente" aria-disabled="true">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
        </section>
    </main>

</body>
</html>
